<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{SUBJECT}}</title>
    <!--[if mso]><noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript><![endif]-->
    <style>
        /* Reset */
        body, table, td, p, a, li { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        body { margin: 0; padding: 0; width: 100% !important; background: #f4f6f8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; color: #1a2138; line-height: 1.6; }
        img { border: 0; outline: none; text-decoration: none; max-width: 100%; }

        /* Layout */
        .wrapper { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .header { background: #1C6852; padding: 28px 32px; text-align: center; }
        .header h1 { margin: 0; color: #ffffff; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
        .content { padding: 32px; font-size: 15px; line-height: 1.7; color: #333333; }
        .content h2 { color: #1C6852; font-size: 18px; font-weight: 700; margin: 0 0 16px; }
        .content p { margin: 0 0 16px; }
        .content a { color: #1C6852; }

        /* Info box */
        .info-box { background: #f0faf6; border-left: 4px solid #1C6852; padding: 16px 20px; margin: 16px 0; border-radius: 0 6px 6px 0; font-size: 14px; line-height: 1.6; }

        /* CTA Button */
        .btn { display: inline-block; background: #1C6852; color: #ffffff !important; text-decoration: none; padding: 12px 28px; border-radius: 6px; font-weight: 600; font-size: 15px; margin: 8px 0; }

        /* Footer */
        .footer { padding: 20px 32px; text-align: center; font-size: 12px; color: #999999; border-top: 1px solid #eeeeee; }
        .footer a { color: #1C6852; text-decoration: none; }
        .footer p { margin: 4px 0; }

        /* Mobile */
        @media (max-width: 640px) {
            .wrapper { margin: 0 12px !important; border-radius: 0 !important; }
            .content { padding: 20px !important; }
            .header { padding: 20px !important; }
        }
    </style>
</head>
<body>
    <div style="padding: 24px 0; background: #f4f6f8;">
        <div class="wrapper" style="max-width:600px;margin:0 auto;background:#ffffff;border-radius:8px;overflow:hidden;">
            <!-- Header -->
            <div class="header" style="background:#1C6852;padding:28px 32px;text-align:center;">
                <h1 style="margin:0;color:#ffffff;font-size:18px;font-weight:700;">{{SITE_NAME}}</h1>
            </div>

            <!-- Content -->
            <div class="content" style="padding:32px;font-size:15px;line-height:1.7;color:#333333;">
                {{CONTENT}}
            </div>

            <!-- Footer -->
            <div class="footer" style="padding:20px 32px;text-align:center;font-size:12px;color:#999999;border-top:1px solid #eeeeee;">
                <p style="margin:4px 0;">{{PSYCHOLOGIST_NAME}} · {{CONTACT_PHONE}}</p>
                <p style="margin:4px 0;"><a href="{{SITE_URL}}" style="color:#1C6852;text-decoration:none;">{{SITE_URL}}</a></p>
                <p style="margin:4px 0;">&copy; {{YEAR}} {{SITE_NAME}}. Tüm hakları saklıdır.</p>
            </div>
        </div>
    </div>
</body>
</html>
